server:
  port: 8082

spring:
  application:
    name: balance.service
  config:
    import: "optional:configserver:"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parko_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      # validate: no modifica el esquema, falla al arrancar si las entidades no coinciden con las tablas.
      # El esquema se mantiene con los scripts de parko-postgre-schemas. Para volver al comportamiento anterior
      # (o en un entorno con base vacia) definir HIBERNATE_DDL_AUTO=update.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/Parko}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:user}
    password: ${RABBITMQ_PASSWORD:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:F:/Repos/parko-2271f-firebase-adminsdk-fbsvc-95314aaf21.json}

balance:
  topup:
    max-amount: ${BALANCE_TOPUP_MAX_AMOUNT:50000}
  charge:
    # Client de Keycloak (claim "azp") autorizado a llamar a POST /api/v1/balance/charge.
    # Debe coincidir con el KEYCLOAK_CLIENT_ID con el que access-service pide su token.
    allowed-client-id: ${BALANCE_CHARGE_ALLOWED_CLIENT_ID:access-service}
