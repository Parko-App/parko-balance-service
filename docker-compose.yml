services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: parko-balance-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - parko-balance-rabbitmq-data:/var/lib/rabbitmq

volumes:
  parko-balance-rabbitmq-data:
